    <g fill="#b3bcc5"><rect x="120" y="716" width="22" height="80"/><rect x="520" y="716" width="22" height="80"/><rect x="920" y="716" width="22" height="80"/><rect x="1320" y="716" width="22" height="80"/></g>
    <g transform="translate(380 664)">
