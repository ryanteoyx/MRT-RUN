    <rect x="380" y="250" width="80" height="320" fill="#86a3bb"/>
    <polygon points="380,250 420,215 460,250" fill="#86a3bb"/>
    <rect x="470" y="330" width="60" height="240" fill="#a7bccd"/>
    <rect x="540" y="280" width="75" height="290" fill="url(#glass)"/>
    <rect x="625" y="360" width="55" height="210" fill="#9db4c6"/>
