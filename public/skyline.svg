<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8d6"/>
      <stop offset="0.45" stop-color="#b9cfe6"/>
      <stop offset="0.75" stop-color="#f6cfa8"/>
      <stop offset="1" stop-color="#f4a77f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffe2a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b991"/>
      <stop offset="0.4" stop-color="#8fb3c9"/>
      <stop offset="1" stop-color="#3f6f8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb8cc"/>
      <stop offset="1" stop-color="#6f8ca6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bfd6"/>
      <stop offset="1" stop-color="#c6cfdc"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="430" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="430" r="70" fill="#fff4d6"/>

  <!-- clouds -->
  <g fill="#fffaf2" opacity="0.95" filter="url(#soft)">
    <ellipse cx="260" cy="170" rx="170" ry="60"/><ellipse cx="360" cy="140" rx="120" ry="70"/><ellipse cx="180" cy="150" rx="90" ry="50"/>
    <ellipse cx="900" cy="120" rx="200" ry="55"/><ellipse cx="1000" cy="95" rx="120" ry="60"/><ellipse cx="820" cy="105" rx="90" ry="45"/>
    <ellipse cx="1420" cy="210" rx="150" ry="50"/><ellipse cx="1500" cy="185" rx="100" ry="55"/>
  </g>
  <g fill="#ffe9d6" opacity="0.6">
