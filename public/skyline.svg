      <rect x="1094" y="722" width="132" height="10"/><rect x="1214" y="712" width="132" height="10"/><rect x="1334" y="727" width="132" height="10"/><rect x="1454" y="717" width="146" height="10"/>
    </g>
    <g fill="#5b6b7a" opacity="0.55">
      <rect x="40" y="760" width="22" height="36" rx="10"/><rect x="95" y="760" width="22" height="36" rx="10"/><rect x="160" y="752" width="22" height="36" rx="10"/><rect x="215" y="752" width="22" height="36" rx="10"/><rect x="280" y="765" width="22" height="36" rx="10"/><rect x="335" y="765" width="22" height="36" rx="10"/><rect x="400" y="757" width="22" height="36" rx="10"/><rect x="455" y="757" width="22" height="36" rx="10"/>
      <rect x="1120" y="760" width="22" height="36" rx="10"/><rect x="1175" y="760" width="22" height="36" rx="10"/><rect x="1240" y="752" width="22" height="36" rx="10"/><rect x="1295" y="752" width="22" height="36" rx="10"/><rect x="1360" y="765" width="22" height="36" rx="10"/><rect x="1415" y="765" width="22" height="36" rx="10"/><rect x="1485" y="757" width="22" height="36" rx="10"/><rect x="1540" y="757" width="22" height="36" rx="10"/>
    </g>
    <g fill="#6aa665"><circle cx="560" cy="790" r="40"/><circle cx="610" cy="770" r="34"/><circle cx="1010" cy="790" r="40"/><circle cx="1060" cy="775" r="30"/></g>
    <g fill="#8cc47a"><circle cx="548" cy="775" r="18"/><circle cx="1000" cy="775" r="18"/></g>
  </g>
